[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reversing-lab"
version = "1.0.0"
description = "A web platform for learning reverse engineering (ELF/PE/Mach-O static analysis + challenges)."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MintKangaroo" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "capstone>=5.0",
    "lief>=0.14",
    "pyelftools>=0.30",
    "pefile>=2023.2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["reversing_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["reversing_lab"]
