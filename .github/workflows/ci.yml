name: CI

on:
  push:
    branches: ["main", "feature/**", "feat/**", "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate Alembic migration
        env:
          RLAB_DATABASE_URL: sqlite:///./ci-migration.db
        run: |
          alembic upgrade head
          alembic check
      - run: pytest

  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reversing_lab_ci
          POSTGRES_USER: reversing_lab
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reversing_lab -d reversing_lab_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      RLAB_DATABASE_URL: postgresql+psycopg://reversing_lab:ci-only-password@127.0.0.1:5432/reversing_lab_ci
      RLAB_TEST_POSTGRES_URL: postgresql+psycopg://reversing_lab:ci-only-password@127.0.0.1:5432/reversing_lab_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-postgres.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-postgres.txt
      - name: Validate PostgreSQL migration round-trip
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check
      - run: pytest tests/test_postgresql.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git diff --check HEAD^ HEAD
